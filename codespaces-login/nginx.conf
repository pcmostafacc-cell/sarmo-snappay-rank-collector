error_log stderr warn;
pid nginx.pid;
events {}
http {
  access_log off;
  client_max_body_size 1k;
  client_body_temp_path body;
  proxy_temp_path proxy;
  fastcgi_temp_path fastcgi;
  uwsgi_temp_path uwsgi;
  scgi_temp_path scgi;
  server {
    listen 127.0.0.1:6080;
    location = /vnc/websockify {
      if ($http_origin != "PORTAL_ORIGIN") { return 403; }
      auth_request /portal-check;
      proxy_pass http://127.0.0.1:6082/websockify;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 900s;
    }
    location = /portal-check {
      internal;
      proxy_pass http://127.0.0.1:6081/portal-check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location /vnc/ {
      proxy_pass http://127.0.0.1:6082/;
    }
    location / {
      proxy_pass http://127.0.0.1:6081;
    }
  }
}
