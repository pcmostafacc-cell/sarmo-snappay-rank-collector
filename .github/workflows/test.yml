name: Sarmo SnappPay checks
on:
  workflow_dispatch:
  push:
    paths:
      - '*.mjs'
      - 'package.json'
      - 'wordpress-plugin/**/*.php'
      - 'tests/**/*.php'
      - 'codespaces-login/**'
      - '.devcontainer/**'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in wordpress-plugin/*.php; do php -l "$file"; done
      - run: php -l tests/otp-guard.php
      - run: php -l tests/source-health.php
      - run: php -l tests/market-report.php
      - run: php tests/otp-guard.php
      - run: php tests/source-health.php
      - run: php tests/market-report.php
      - run: php -l tests/ads-snapshot.php && php tests/ads-snapshot.php
      - run: node --test *.test.mjs codespaces-login/*.test.mjs
      - run: for file in codespaces-login/*.sh; do bash -n "$file" || exit; done
      - run: node --check codespaces-login/server.mjs && node --check codespaces-login/portal.js
      - run: for file in *.mjs; do node --check "$file"; done
