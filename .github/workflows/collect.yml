name: Sarmo SnappPay rank collector
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
concurrency:
  group: sarmo-snappay-collector
  cancel-in-progress: false
jobs:
  collect:
    # Keep the ten-minute schedule idle until WordPress 0.6.0 is installed and verified.
    if: ${{ vars.SARMO_COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SARMO_WP_URL: ${{ secrets.SARMO_WP_URL }}
      SARMO_WP_USER: ${{ secrets.SARMO_WP_USER }}
      SARMO_WP_APP_PASSWORD: ${{ secrets.SARMO_WP_APP_PASSWORD }}
      SARMO_MERCHANT_ALIASES: ${{ vars.SARMO_MERCHANT_ALIASES }}
      SARMO_PRODUCT_IDS: ${{ vars.SARMO_PRODUCT_IDS }}
      SARMO_SELLER_IDS: ${{ vars.SARMO_SELLER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: for file in wordpress-plugin/*.php; do php -l "$file"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node --test *.test.mjs
      - run: node run-collector.mjs
