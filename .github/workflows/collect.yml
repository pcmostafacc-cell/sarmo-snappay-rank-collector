name: Sarmo SnappPay rank collector
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sarmo-snappay-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SARMO_WP_URL: ${{ secrets.SARMO_WP_URL }}
      SARMO_WP_USER: ${{ secrets.SARMO_WP_USER }}
      SARMO_WP_APP_PASSWORD: ${{ secrets.SARMO_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: echo 'Collector schedule paused during coordinated 0.6.0 deployment.'
