name: Sarmo Ads campaign report
on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
concurrency:
  group: sarmo-snappay-ads-reader
  cancel-in-progress: false
jobs:
  read_ads:
    if: ${{ vars.SARMO_ADS_READER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SARMO_WP_URL: ${{ secrets.SARMO_WP_URL }}
      SARMO_ADS_WP_USER: ${{ secrets.SARMO_ADS_WP_USER }}
      SARMO_ADS_WP_APP_PASSWORD: ${{ secrets.SARMO_ADS_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - id: preflight
        run: node run-ads-collector.mjs --preflight
      - if: steps.preflight.outputs.run == 'true'
        run: npx playwright install chromium --with-deps
      - if: steps.preflight.outputs.run == 'true'
        run: node run-ads-collector.mjs
