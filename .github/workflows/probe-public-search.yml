name: Probe public SnappPay search
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-public-search.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - run: node probe-public-search.mjs
